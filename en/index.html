<h2>🌟 Why use Starbot?</h2>
<ul>
  <li><strong>All-in-one:</strong> economy, moderation, music, tickets, Minecraft — no need for 5 different bots.</li>
  <li><strong>Multi-language:</strong> native support for Portuguese, English, and Spanish. Each user chooses their language.</li>
  <li><strong>Web panel:</strong> own dashboard where admins configure the bot without typing commands.</li>
  <li><strong>Secure sessions:</strong> Discord OAuth2 with PKCE, CSRF state, single-session enforcement, AES-256-GCM encryption.</li>
  <li><strong>Up-to-date:</strong> discord.js v14.27, discord-player v7.2, mongoose v9 — always on the latest stable versions.</li>
  <li><strong>Open source:</strong> full transparency, auditable security.</li>
</ul>
