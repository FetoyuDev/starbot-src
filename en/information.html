<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information — Starbot Docs</title>
  <meta name="description" content="View details about users, servers, channels, roles, and the bot itself.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div id="app">
    <template id="page-content">
      <h1>📊 Information Commands</h1>
      <p class="subtitle">View details about users, servers, channels, roles, and the bot itself.</p>
      
<h2>User info</h2>
<ul>
  <li><code>/perfil</code> — full profile (badges, title, marriage status)</li>
  <li><code>/avatar</code> — user avatar in large size</li>
  <li><code>/usuario-info</code> — technical user info</li>
</ul>

<h2>Server info</h2>
<ul>
  <li><code>/servidor-info</code> — server info</li>
  <li><code>/canal-info</code> — channel info</li>
  <li><code>/cargo-info</code> — role info</li>
</ul>

<h2>Bot info</h2>
<ul>
  <li><code>/bot-info</code> — bot stats</li>
  <li><code>/ajuda</code> — interactive command list</li>
</ul>

    </template>
  </div>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
