      <h2>🌟 Por que usar o Starbot?</h2>
      <ul>
        <li><strong>Tudo em um:</strong> economia, moderação, música, tickets, Minecraft — não precisa de 5 bots diferentes.</li>
        <li><strong>Multi-idioma:</strong> suporte nativo a português, inglês e espanhol. Cada usuário escolhe seu idioma.</li>
        <li><strong>Painel web:</strong> dashboard próprio onde admins configuram o bot sem precisar digitar comandos.</li>
        <li><strong>Sessões seguras:</strong> OAuth2 do Discord com PKCE, CSRF state, single-session enforcement, criptografia AES-256-GCM.</li>
        <li><strong>Atualizado:</strong> discord.js v14.27, discord-player v7.2, mongoose v9 — sempre nas versões estáveis mais recentes.</li>
        <li><strong>Código aberto:</strong> transparência total, segurança auditável.</li>
      </ul>
